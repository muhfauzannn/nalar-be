services:
  be:
    image: bernalar-be:dokploy
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - ../persistent/be.env
    environment:
      # Uploaded PDFs go to Cloudflare R2. The S3_* credentials live in ../persistent/be.env.
      STORAGE_DRIVER: s3
      # The database runs next to the API on this server (Dokploy postgres
      # "nalar-db"), not on Neon: every query was a trip to us-east-1. Overrides
      # DATABASE_URL in ../persistent/be.env; the password is in Dokploy's env.
      DATABASE_URL: postgresql://nalar:${NALAR_DB_PASSWORD:?set NALAR_DB_PASSWORD in the Dokploy environment}@nalar-db-spwikl:5432/nalar
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped

  fe:
    image: bernalar-fe:dokploy
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: https://api.nalar.muhfauzan.dev
        VITE_APP_URL: https://nalar.muhfauzan.dev
    env_file:
      - ../persistent/fe.env
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped

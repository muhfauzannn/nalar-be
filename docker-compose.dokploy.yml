services:
  be:
    image: bernalar-be:dokploy
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - ../persistent/be.env
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped

  fe:
    image: bernalar-fe:dokploy
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: https://api.nalar.muhfauzan.dev
        VITE_APP_URL: https://nalar.muhfauzan.dev
    env_file:
      - ../persistent/fe.env
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped

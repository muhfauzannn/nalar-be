name: Deploy Bernalar via Dokploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy.yml'
      - '.github/actions/deploy-dokploy/action.yml'
  workflow_dispatch:

concurrency:
  group: bernalar-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates (and drops) its own throw-away database on this server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  build:
    name: Build backend and pinned frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout with frontend submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker buildx build --platform linux/amd64 --target runtime --load -t nalar-be:ci .

      - name: Build frontend image
        run: |
          docker buildx build --platform linux/amd64 --target runtime --load \
            --build-arg VITE_API_URL=https://api.nalar.muhfauzan.dev \
            --build-arg VITE_APP_URL=https://nalar.muhfauzan.dev \
            -t nalar-fe:ci frontend

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for local action
        uses: actions/checkout@v4

      - name: Deploy through Dokploy
        uses: ./.github/actions/deploy-dokploy
        with:
          compose_id: hOqFxK2FyPY192k4NnXiJ
          dokploy_api_key: ${{ secrets.DOKPLOY_API_KEY }}
